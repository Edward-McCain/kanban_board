services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: polotno
      POSTGRES_PASSWORD: polotno
      POSTGRES_DB: polotno
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polotno -d polotno"]
      interval: 2s
      timeout: 3s
      retries: 20
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://polotno:polotno@db:5432/polotno
      SEED_BOARD: "1"
    depends_on:
      db:
        condition: service_healthy
